name: kanji_app
description: "漢字学習アプリ - 小学1〜6年生対応"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Klee One
      fonts:
        - asset: assets/fonts/KleeOne-Regular.ttf
          weight: 400
        - asset: assets/fonts/KleeOne-SemiBold.ttf
          weight: 600
